<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coloriage à imprimer</title>
  <style>
    @page { size: A4 portrait; margin: 0; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #ddd; }
    .barre { display: flex; gap: 12px; justify-content: center; padding: 16px; flex-wrap: wrap; }
    .barre button, .barre a {
      font: inherit; font-size: 1.1rem; padding: 12px 20px; border-radius: 14px; border: none;
      background: #2fbf71; color: #fff; text-decoration: none; cursor: pointer;
    }
    .barre a { background: #fff; color: #12324a; }
    .aide { text-align: center; margin: 0 16px 16px; color: #333; }
    #feuille { display: flex; justify-content: center; padding-bottom: 24px; }
    #feuille svg { width: min(100%, 210mm); height: auto; background: #fff; box-shadow: 0 4px 20px rgba(0,0,0,.2); }
    @media print {
      body { background: #fff; }
      .barre, .aide { display: none; }
      #feuille { padding: 0; }
      #feuille svg { width: 210mm; height: 297mm; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="barre">
    <a href="index.html">Retour</a>
    <button id="imprimer">Imprimer</button>
  </div>
  <p class="aide">Imprimez en A4, à 100 % (sans « ajuster à la page » si possible). Les 4 carrés noirs doivent rester visibles.</p>
  <div id="feuille"></div>
  <script type="module">
    import { MER, pageSVG } from "./js/pages.js";
    document.getElementById("feuille").innerHTML = pageSVG(MER);
    document.getElementById("imprimer").addEventListener("click", () => window.print());
  </script>
</body>
</html>
